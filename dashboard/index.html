function fmtRaw(code, raw){

function factorsFor(t, a){
  const real = REAL_FACTOR_DATA[t.key] && REAL_FACTOR_DATA[t.key][a.id];
  return t.factors.map(f=>{
    const realField = real && real[f.code];
    if(realField){
      if(realField.pct===null) return { ...f, pct: null, raw: null, isReal: true }; // 이 사람은 실측으로 결측 확인됨
      const out = { ...f, pct: Math.round(realField.pct), raw: realField.raw, isReal: true };
      if(f.dir==='pos' || f.dir==='neg') out.delta = Math.round((f.dir==='pos' ? (realField.pct-50) : (50-realField.pct)) * 0.4);
      return out; // dir:'na'인 변수(예: 현거주지 평형)는 방향성이 없어 델타(긍정/부정)를 매기지 않는다
    }
    if(f.pct===null) return f; // 실측 데이터가 아예 없고 원 정의상 구조적 결측인 변수
    const pct = seededPct(a.id+'|'+f.code, 8, 96); // 실데이터 미확보 임시값
    const out = { ...f, pct };
    if(f.dir==='pos' || f.dir==='neg') out.delta = Math.round((f.dir==='pos' ? (pct-50) : (50-pct)) * 0.4);
    return out;
  });
}
/* 이 사람에게 실제로 '튀는'(백분위가 50에서 가장 많이 벗어난) 변수 상위 n개만 고른다.
   개인별 로컬 SHAP 값이 없는 상태에서, 있는 실제 데이터(백분위)만으로 화면마다 다른 변수 조합을 보여주기 위한 선택 로직.
   방향성 없는(dir:'na') 변수와 결측 변수는 선택 대상에서 빼고 항상 별도로 그대로 보여준다. */
function topFactorsFor(t, a, n=4){
  const factors = factorsFor(t, a);
  const rankable = factors.filter(f=>f.pct!==null && f.delta!==undefined);
  const others = factors.filter(f=>f.pct===null || f.delta===undefined);
  const top = rankable.slice().sort((x,y)=>Math.abs(y.pct-50)-Math.abs(x.pct-50)).slice(0, n);
  return top.concat(others);
}

  if(negatives.length){ html += `<div class="group-label">개선 여지</div>${negatives.map(row).join('')}`; }

  <div class="h1s" style="margin-top:8px;">근거 자료를<br>확인하세요</div>

  <div style="font-size:12.5px;font-weight:700;margin:14px 0 8px;">세부 진단 (${factors.length}개 변수)</div>
  ${factorCards(factors)}
  <div class="btn btn-primary" style="margin-top:6px;" onclick="advance()">근거·신뢰도 확인 →</div>
`; }
function screenE2(){
  const t=T(); const checkedN = state.caveats.filter(Boolean).length;
  const existPct = t.existAuc!==null ? Math.round((t.existAuc-0.4)/(1-0.4)*100) : 0;
  const altPct = Math.round((t.altAuc-0.4)/(1-0.4)*100);
  const checks = CAVEATS.map((c,i)=>`
    <div class="check-line" onclick="toggleCaveat(${i})"><div class="checkbox ${state.caveats[i]?'checked':''}">${state.caveats[i]?'✓':''}</div>
    <div class="check-body"><div class="t" style="font-weight:500;font-size:12.5px;line-height:1.6;">${c}</div></div></div>`).join('');
  return `
  <div class="h1s">근거 · 신뢰도</div>
  <div class="p1s">이 등급이 얼마나 검증됐는지 보여드려요.</div>
  <div class="bar-compare"><div class="lbl"><span>기존 신용정보${t.key==='B'?' 26개':''}</span><span style="font-weight:800;color:var(--negative)">${t.existAuc!==null?('AUC '+t.existAuc):'확인 필요'}</span></div>
    <div class="bar-track"><div class="bar-fill" style="width:${existPct}%;background:var(--negative);"></div></div>
    <div class="foot-note" style="margin-top:4px;">${t.existP}</div></div>
  <div class="bar-compare"><div class="lbl"><span>대안변수${t.key==='B'?' 66개':' 10개'}</span><span style="font-weight:800;color:var(--positive)">AUC ${t.altAuc}</span></div>
    <div class="bar-track"><div class="bar-fill" style="width:${altPct}%;background:var(--positive);"></div></div>
    <div class="foot-note" style="margin-top:4px;">${t.altP}</div></div>
  <div class="card tinted">독립 검증 확인됨<div class="foot-note" style="margin-top:4px;">${t.indepNote}</div></div>
  <div class="row-between" style="margin:16px 0 4px;"><span style="font-size:13px;font-weight:700;">한계 고지</span><span style="font-size:11.5px;color:var(--ink-faint);">모두 확인해야 다음 진행 · ${checkedN}/4</span></div>
  ${checks}
  <button class="btn btn-primary" style="margin-top:16px;" ${allCaveatsChecked()?'':'disabled'} onclick="advance()">등급·최종판단으로 →</button>
`; }
function screenE3(){
  const t=T(); const a=t.applicants[state.examinerAppIdx];
  const rows = (t.cutoffTable||[]).map(r=>`<div class="list-line"><span>${r.label}</span><span style="font-weight:700;">${r.prec} 정밀도 · ${r.rec} 재현율</span></div>`).join('')
    || '<div class="foot-note">Track A 컷오프표는 확인 필요 — 별도 산출표 미확보 상태예요.</div>';
  return `
  <div class="h1s">등급 · 최종판단</div>
  <div class="p1s">${a.id} · ${a.grade}등급 · 상위 ${(100-a.pct).toFixed(1).replace(/\.0$/,'')}%</div>
  <div class="card"><div style="font-size:12.5px;font-weight:700;margin-bottom:6px;">등급별 컷오프 활용표</div>${rows}</div>
  <div class="foot-note" style="margin:4px 0 14px;">점수 = 상대적 순위이며 확률이 아닙니다. 참고자료로만 활용하세요.</div>
  <div style="font-size:13px;font-weight:700;margin-bottom:8px;">최종 판단</div>
  <div class="decision-row">
    <button class="decision-btn approve ${state.decision==='승인'?'sel':''}" onclick="setDecision('승인')">승인</button>
    <button class="decision-btn hold ${state.decision==='보류'?'sel':''}" onclick="setDecision('보류')">보류</button>
    <button class="decision-btn reject ${state.decision==='거절'?'sel':''}" onclick="setDecision('거절')">거절</button>
  </div>
`; }
const OTHER_REVIEWERS = [
  {n:'심사역 2', reason:'상환능력 관련 변수가 안정적이고, 결측·이상치가 없어 근거 신뢰도가 높다고 판단'},
  {n:'심사역 3', reason:'컷오프 기준상 참고자료 요건은 충족하나, 소득 서류 확인 후 최종 확정을 권고'},
];
function screenE4(){
  const t=T(); const a=t.applicants[state.examinerAppIdx];
  if(state.submitted){
    const others = OTHER_REVIEWERS.map(o=>{
      const d = o===OTHER_REVIEWERS[0] ? (state.decision==='거절' ? '보류' : '승인') : (state.decision||'승인');
      return `<div class="card"><div class="row-between"><span style="font-weight:700;font-size:13px;">${o.n}</span><span class="badge ${d==='승인'?'manage':'watch'}">${d}</span></div>
        <div class="foot-note" style="margin-top:4px;">${o.reason}</div></div>`;
    }).join('');
    return `
    <div class="h1s">완료 · 감사로그</div>
    <div class="p1s">${a.id} · 내 판단: <b style="color:var(--ink)">${state.decision}</b> · ${state.examinerName}</div>
    <div class="card tinted"><div style="font-weight:700;font-size:13px;margin-bottom:4px;">내 제출 내용</div>
      <div class="foot-note" style="margin:0;">${state.examinerReason}</div></div>
    <div style="font-size:13px;font-weight:700;margin:16px 0 8px;">다른 심사위원 의견</div>
    ${others}
    <div class="btn-row"><div class="btn btn-outline" onclick="printReport()">인쇄 · PDF 저장</div><div class="btn btn-primary" onclick="jump('e0')">다음 신청자</div></div>
    <div class="btn btn-outline" style="margin-top:10px;" onclick="goLogin()">처음으로</div>
    `;
  }
  return `
  <div class="h1s">완료 · 감사로그</div>
  <div class="p1s">${a.id} · 내 판단: <b style="color:var(--ink)">${state.decision||'미지정'}</b></div>
  <div class="card tinted">이름과 판단 이유를 남기고 제출해야, 다른 심사위원들의 판단을 열람할 수 있어요. (블라인드 리뷰)</div>
  <div style="font-size:12.5px;font-weight:700;margin:14px 0 6px;">심사자 이름</div>
  <input id="examinerNameInput" type="text" placeholder="예: 홍길동" value="${state.examinerName}" class="ex-input">
  <div style="font-size:12.5px;font-weight:700;margin:14px 0 6px;">이 판단을 내린 이유</div>
  <textarea id="examinerReasonInput" placeholder="예: 근거 변수의 신뢰구간과 컷오프 기준을 종합해 판단했습니다" class="ex-input ex-textarea">${state.examinerReason}</textarea>
  <button id="submitBtn" class="btn btn-primary" style="margin-top:14px;" disabled onclick="submitReview()">제출하고 다른 의견 보기</button>
  <div class="btn btn-outline" style="margin-top:10px;" onclick="goLogin()">처음으로</div>
`; }
function wireE4Inputs(){
  const nameEl = document.getElementById('examinerNameInput');
  const reasonEl = document.getElementById('examinerReasonInput');
  const btn = document.getElementById('submitBtn');
  if(!nameEl || !btn) return;
  function check(){
    state.examinerName = nameEl.value;
    state.examinerReason = reasonEl.value;
    btn.disabled = !(nameEl.value.trim() && reasonEl.value.trim());
  }
  nameEl.addEventListener('input', check);
  reasonEl.addEventListener('input', check);
  check();
}

const E_RENDER = { e0:screenE0, e1:screenE1, e2:screenE2, e3:screenE3, e4:screenE4 };

/* ================= NOTES ================= */
const P_NOTES = {
  p0:{tag:'P0 · 로그인', h:'본인인증', p:'회원가입 없이 휴대폰 본인인증만으로 조회를 시작한다. 심사자처럼 명단을 보여주지 않고, 실제 사용자 흐름과 동일하게 설계했다.'},
  p1:{tag:'P1 · 교육', h:'문제 인식 · 신뢰 구축', p:'"위험해서가 아니라 정보가 없었을 뿐"이라는 메시지를 신뢰 지표로 뒷받침한다.'},
  p2:{tag:'P2 · 온보딩', h:'동의 및 데이터 연동', p:'마이데이터 방식으로 필요한 정보만, 신용평가 목적에만 사용된다는 것을 명시한다.'},
  p3:{tag:'P3 · 프로세싱', h:'분석 로딩', p:'실제 파이프라인(수집→분석→등급 산출)을 3단계로 단순화해 보여준다.'},
  p4:{tag:'P4 · 핵심 화면', h:'결과 · 잠재등급 게이지', p:'동년배 등급 분포 위에 내 위치를 얹는 히스토그램 방식. 상대적 위치를 가장 정직하게 보여준다.'},
  p5:{tag:'P5 · 설명가능성', h:'근거 설명', p:'실제 변수명을 그대로 노출하고, 전체 모집단 대비 백분위(미드랭크 방식)로 표기한다.'},
  p6:{tag:'P6 · 리텐션', h:'개선 가이드', p:'컷오프 로직을 역이용해 "어떤 행동이 등급 상승에 유리한지" 사용자 언어로 제공한다.'},
  p7:{tag:'P7 · 전환', h:'활용 · 리포트 전송', p:'진단 결과를 실제 심사에 연결하는 분기점. "참고자료"라는 원칙을 다시 한 번 명문화한다.'},
  'p7-1a':{tag:'P7-1 · 은행', h:'은행 사전심사 안내', p:'대안등급으로 사전심사 조건을 먼저 비교하고, 신용조회 영향 없이 진행됨을 강조한다.'},
  'p7-1b':{tag:'P7-1 · 은행', h:'은행 사전심사 조건', p:'대안등급 반영 시 예상 금리·한도는 확정 조건이 아니라 참고치임을 명시한다.'},
  'p7-2a':{tag:'P7-2 · 보증재단', h:'보증서 안내', p:'재단이 보증을 서면 은행은 담보 없이 대출을 실행한다는 구조를 설명한다.'},
  'p7-2b':{tag:'P7-2 · 보증재단', h:'보증 프로그램 매칭', p:'내 등급이 재단의 인정구간 안에 있는지 즉시 확인해준다.'},
  'p7-3a':{tag:'P7-3 · 카드사', h:'첫 카드 발급 안내', p:'소득증빙 없이 대안등급만으로 첫카드 발급심사를 받을 수 있다는 점을 강조한다.'},
  'p7-3b':{tag:'P7-3 · 카드사', h:'첫 카드 예상 조건', p:'첫 카드가 다음 신용이력을 만드는 시작점이라는 서비스의 선순환 구조를 보여준다.'},
  p8:{tag:'P8 · 완료', h:'전송 완료', p:'개인 플로우의 마지막 화면. 여기서 바로 심사자 콘솔로 넘어가 같은 근거가 어떻게 보이는지 비교할 수 있다.'},
};
const E_NOTES = {
  e0:{tag:'E0 · 대기열', h:'심사 대기열', p:'Track A/B 전환 가능, 각 트랙 9개 등급을 모두 포함하는 실제 데이터 기반 신청자 9명으로 구성.'},
  e1:{tag:'E1 · 근거 변수', h:'대안변수 리포트', p:'개인 화면(P5)과 동일한 근거를 심사역용으로도 노출해 일관성을 확보한다.'},
  e2:{tag:'E2 · 신뢰도', h:'근거·신뢰도 검증', p:'AUC 비교와 한계고지 체크박스 4개 — 4개를 모두 체크해야 다음 단계로 진행할 수 있도록 설계해 심사자가 한계를 인지하고 넘어가도록 한다.'},
  e3:{tag:'E3 · 최종판단', h:'등급 · 최종판단', p:'등급 컷오프 기준표를 제공하고, 심사자가 승인/보류/거절 중 하나를 선택해 제출한다.'},
  e4:{tag:'E4 · 감사로그', h:'완료 · 감사로그', p:'본인 판단을 제출해야 다른 심사위원들의 판단을 열람할 수 있는 블라인드 리뷰 구조.'},
};

/* ================= RENDER ================= */
function renderRail(){
  const railWrap = document.getElementById('railWrap');
  if(state.flow==='login'){ railWrap.style.display='none'; return; }
  railWrap.style.display='block';
  const list = currentList();
  document.getElementById('rail').innerHTML = list.map((s,i)=>`
    <div class="chip ${i===state.screenIdx?'active':''}" onclick="jump('${s.id}')"><div class="n">${s.n}</div><div class="l">${s.l}</div></div>`).join('');
  document.getElementById('progressFill').style.width = ((state.screenIdx+1)/list.length*100)+'%';
}

function render(){
  document.getElementById('metaAuc').innerHTML = `모형 근거 <b>AUC ${T().auc}</b> · ${T().aucNote}`;
  renderRail();

  const stage = document.getElementById('stage');
  if(state.flow==='login'){
    clearLoadingTimer();
    stage.innerHTML = renderLogin();
    const tl = document.getElementById('trackToggleLogin');
    if(tl) tl.addEventListener('click', e=>{ const b=e.target.closest('.mini-btn'); if(b) setTrack(b.dataset.track); });
    return;
  }
  const list = currentList();
  const cur = list[state.screenIdx];
  const RENDER = state.flow==='examiner' ? E_RENDER : P_RENDER;
  const NOTES = state.flow==='examiner' ? E_NOTES : P_NOTES;
  const note = NOTES[cur.id];
  stage.innerHTML = `
    <div class="phone">
      <div class="statusbar"><span>9:41</span><span class="icons">■■■ 📶 🔋</span></div>
      <div class="screen">${RENDER[cur.id]()}</div>
    </div>
    <div class="note-panel">
      <div class="tag">${note.tag}</div>
      <h3>${note.h}</h3>
      <p>${note.p}</p>
      <div class="note-block">
        <div class="h">보기 전환</div>
        <div class="mini-toggle" id="trackToggleSide">
          <button class="mini-btn ${state.track==='B'?'active':''}" data-track="B">Track B</button>
          <button class="mini-btn ${state.track==='A'?'active':''}" data-track="A">Track A</button>
        </div>
        <div class="mini-toggle" id="flowToggleSide" style="margin-top:6px;">
          <button class="mini-btn ${state.flow==='personal'?'active':''}" data-flow="personal">개인 플로우</button>
          <button class="mini-btn ${state.flow==='examiner'?'active':''}" data-flow="examiner">심사자 콘솔</button>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;">
          <span style="font-size:11px;color:var(--ink-faint);">${T().label} · ${T().popLabel}</span>
          <span class="side-link" onclick="goLogin()">처음으로</span>
        </div>
      </div>
      ${state.flow==='personal' ? `
      <div class="note-block"><div class="h">데모 신청자 미리보기</div>
        <select id="demoAppSelect" style="width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--line);font-size:12.5px;font-family:inherit;color:var(--ink);">
          ${T().applicants.map((a,i)=>`<option value="${i}" ${i===state.personalAppIdx?'selected':''}>${a.id} · ${a.grade}등급 · 상위 ${(100-a.pct).toFixed(1).replace(/\.0$/,'')}%</option>`).join('')}
        </select>
        <div style="font-size:11px;color:var(--ink-faint);margin-top:6px;line-height:1.5;">실제 사용자 화면에는 노출되지 않는 프로토타입 전용 컨트롤이에요.</div>
      </div>` : ''}
      <div class="btn-row">
        <div class="btn btn-outline" onclick="back()">← 이전</div>
        <div class="btn btn-outline" onclick="advance()">다음 →</div>
      </div>
    </div>
  `;
  manageLoadingTimer(state.flow==='personal' ? cur.id : null);
  if(state.flow==='examiner' && cur.id==='e4' && !state.submitted) wireE4Inputs();
  if(state.flow==='personal'){
    const sel = document.getElementById('demoAppSelect');
    if(sel) sel.addEventListener('change', e=>{ state.personalAppIdx = parseInt(e.target.value); render(); });
  }
  const tt = document.getElementById('trackToggleSide');
  if(tt) tt.addEventListener('click', e=>{ const b=e.target.closest('.mini-btn'); if(b) setTrack(b.dataset.track); });
  const ft = document.getElementById('flowToggleSide');
  if(ft) ft.addEventListener('click', e=>{ const b=e.target.closest('.mini-btn'); if(b) switchFlow(b.dataset.flow); });
}

render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>대안신용평가 심사지원 · 로그인</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <div class="login-header">
        <div class="title">대안신용평가 심사지원</div>
        <div class="subtitle">씬파일러 개인용 서비스 로그인</div>
      </div>

      <div id="loginError" class="login-error">아이디 또는 비밀번호가 올바르지 않습니다.</div>

      <form id="loginForm">
        <div class="field">
          <label for="userId">아이디</label>
          <input type="text" id="userId" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="userPw">비밀번호</label>
          <input type="password" id="userPw" autocomplete="current-password" required />
        </div>
        <button type="submit" class="login-btn">로그인</button>
      </form>

      <div class="demo-accounts">
        <div class="demo-title">테스트 계정 (클릭하면 자동입력)</div>
        <div class="demo-item" data-id="trackA_user" data-pw="trackA1234">
          <span class="demo-role">트랙A · 씬파일러</span>
          <span class="demo-cred">trackA_user</span>
        </div>
        <div class="demo-item" data-id="SYN235837" data-pw="trackB1234">
          <span class="demo-role">트랙B · 씬파일러</span>
          <span class="demo-cred">SYN235837</span>
        </div>
        <div class="demo-item" data-id="reviewer" data-pw="reviewer1234">
          <span class="demo-role">심사자</span>
          <span class="demo-cred">reviewer</span>
        </div>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    const form = document.getElementById("loginForm");
    const errorBox = document.getElementById("loginError");
    const idInput = document.getElementById("userId");
    const pwInput = document.getElementById("userPw");

    document.querySelectorAll(".demo-item").forEach((item) => {
      item.addEventListener("click", () => {
        idInput.value = item.dataset.id;
        pwInput.value = item.dataset.pw;
        errorBox.classList.remove("show");
      });
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const id = idInput.value.trim();
      const pw = pwInput.value;
      const account = ACCOUNTS[id];

      if (!account || account.password !== pw) {
        errorBox.classList.add("show");
        return;
      }

      errorBox.classList.remove("show");
      saveSession(id, account);
      window.location.href = account.redirect;
    });

    // 이미 로그인되어 있으면 해당 화면으로 바로 이동
    const existing = getSession();
    if (existing) {
      const acc = Object.values(ACCOUNTS).find((a) => a.role === existing.role);
      if (acc) window.location.href = acc.redirect;
    }
  </script>
</body>
</html>
